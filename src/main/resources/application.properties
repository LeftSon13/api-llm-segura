spring.application.name=api-llm-segura
server.port=${PORT:8080}

# Configure as credenciais fora do código-fonte.
app.security.username=${APP_USER}
app.security.password=${APP_PASSWORD}

# Groq disponibiliza a API Responses compatível com o formato usado pelo serviço.
# Configure GROQ_API_KEY fora do código-fonte.
app.llm.base-url=${LLM_BASE_URL:https://api.groq.com/openai/v1}
app.llm.api-key=${GROQ_API_KEY:}
app.llm.model=${LLM_MODEL:openai/gpt-oss-20b}
